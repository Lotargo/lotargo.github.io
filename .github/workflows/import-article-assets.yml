name: Import article bundles

on:
  workflow_dispatch:
  push:
    paths:
      - '.article-import/**/bundle.zip'
      - '.article-import/**/bundle.tar.gz'
      - '.article-import/**/bundle.tgz'
      - '.article-import/**/bundle.b64'
      - '.article-import/**/READY'
      - '.asset-import/**/bundle.b64'
      - '.asset-import/**/READY'

permissions:
  contents: write

concurrency:
  group: article-bundle-import
  cancel-in-progress: false

jobs:
  import-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-publishing.txt

      - name: Render and import standard article bundles
        run: |
          python scripts/publish_article.py import-staged .article-import --root . --allow-empty

      - name: Import legacy Visual Novel asset bundle when present
        run: |
          if [ -d .asset-import/visual-novel-ai-game ]; then
            python scripts/import_asset_bundle.py .asset-import/visual-novel-ai-game
          else
            echo "No legacy asset bundle"
          fi

      - name: Remove obsolete transport leftovers
        run: |
          rm -f docs/.asset-pipeline-test*.txt docs/test.bin
          rm -rf blog/assets/visual-novel/hires

      - name: Find installed article manifests
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --modified --others --exclude-standard -- \
            'blog/content/*.article.json' > "$RUNNER_TEMP/telegram-changed-files"

          echo "Installed article manifests:"
          cat "$RUNNER_TEMP/telegram-changed-files" || true

      - name: Commit installed publication files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publication files to commit"
          else
            git commit -m "Render and import staged article bundle"
            git push
          fi

      - name: Publish installed articles to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RU_CHAT_ID: ${{ vars.TELEGRAM_RU_CHAT_ID }}
          BLOG_SITE_URL: https://lotargo.github.io
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts/test_publish_telegram.py
          python scripts/publish_telegram.py \
            --root . \
            --changed-file-list "$RUNNER_TEMP/telegram-changed-files"

      - name: Commit Telegram publication state
        shell: bash
        run: |
          set -euo pipefail
          state_file="blog/content/telegram-publications.json"

          if [[ ! -f "$state_file" ]] || [[ -z "$(git status --porcelain -- "$state_file")" ]]; then
            echo "No Telegram publication state changes to commit."
            exit 0
          fi

          git add "$state_file"
          git commit -m "Record Telegram article publication"
          git pull --rebase origin main
          git push origin HEAD:main
