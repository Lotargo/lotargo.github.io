name: Import article bundles

on:
  workflow_dispatch:
  push:
    paths:
      - '.article-import/**/bundle.zip'
      - '.article-import/**/bundle.tar.gz'
      - '.article-import/**/bundle.tgz'
      - '.article-import/**/bundle.b64'
      - '.article-import/**/asset-sources.json'
      - '.article-import/**/READY'
      - '.asset-import/**/bundle.b64'
      - '.asset-import/**/READY'
      - '.github/workflows/import-article-assets.yml'
      - 'scripts/publish_article.py'
      - 'scripts/telegram_preview.py'
      - 'scripts/test_telegram_preview.py'
      - 'scripts/publish_telegram_article.py'
      - 'scripts/test_publish_telegram_article.py'

permissions:
  contents: write

concurrency:
  group: article-bundle-import
  cancel-in-progress: false

jobs:
  import-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-publishing.txt

      - name: Materialize staged remote assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          MAX_FILE_SIZE = 95 * 1024 * 1024
          ALLOWED_HOSTS = {"raw.githubusercontent.com"}

          for manifest_path in Path('.article-import').glob('*/asset-sources.json'):
              article_root = manifest_path.parent.resolve()
              try:
                  manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  print(
                      f"::error file={manifest_path.as_posix()},title=Invalid remote asset manifest::"
                      f"Cannot parse asset-sources.json: {exc}"
                  )
                  raise SystemExit(2)

              if manifest.get('format_version') != 1 or not isinstance(manifest.get('assets'), list):
                  print(
                      f"::error file={manifest_path.as_posix()},title=Invalid remote asset manifest::"
                      "format_version must equal 1 and assets must be an array"
                  )
                  raise SystemExit(2)

              for entry in manifest['assets']:
                  if not isinstance(entry, dict):
                      raise SystemExit('Remote asset entry must be an object')
                  target_value = entry.get('target')
                  url = entry.get('url')
                  expected = entry.get('sha256')
                  if not all(isinstance(value, str) and value for value in (target_value, url, expected)):
                      raise SystemExit('Remote asset target, url, and sha256 must be non-empty strings')

                  relative = Path(target_value)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsafe remote asset target: {target_value}')
                  target = (article_root / relative).resolve()
                  if target != article_root and article_root not in target.parents:
                      raise SystemExit(f'Remote asset escapes article staging directory: {target_value}')

                  parsed = urlparse(url)
                  if parsed.scheme != 'https' or parsed.hostname not in ALLOWED_HOSTS:
                      raise SystemExit(f'Unsupported remote asset URL: {url}')
                  if len(expected) != 64 or any(ch not in '0123456789abcdefABCDEF' for ch in expected):
                      raise SystemExit(f'Invalid SHA-256 for {target_value}')

                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'lotargo-article-asset-importer/1.0'},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read(MAX_FILE_SIZE + 1)
                  if len(data) > MAX_FILE_SIZE:
                      raise SystemExit(f'Remote asset exceeds 95 MB: {target_value}')

                  actual = hashlib.sha256(data).hexdigest()
                  if actual.lower() != expected.lower():
                      raise SystemExit(
                          f'SHA-256 mismatch for {target_value}: expected {expected}, got {actual}'
                      )

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  print(f'Materialized staged remote asset: {target.relative_to(Path.cwd())}')

              manifest_path.unlink()
              print(f'Removed consumed remote asset manifest: {manifest_path}')
          PY

      - name: Decode staged text assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          for encoded in Path('.article-import').glob('**/*.b64asset'):
              target = encoded.with_suffix('')
              try:
                  target.write_bytes(base64.b64decode(encoded.read_text(encoding='ascii'), validate=True))
              except Exception as exc:
                  print(
                      f"::error file={encoded.as_posix()},title=Invalid staged binary asset::"
                      f"Cannot decode {encoded.name}: {exc}"
                  )
                  raise SystemExit(2)
              encoded.unlink()
              print(f"Decoded staged asset: {target}")
          PY

      - name: Test Telegram edition tools
        run: |
          python -m unittest scripts/test_telegram_preview.py
          python -m unittest scripts/test_publish_telegram_article.py

      - name: Render and import standard article bundles
        run: |
          python scripts/publish_article.py import-staged .article-import --root . --allow-empty

      - name: Import legacy Visual Novel asset bundle when present
        run: |
          if [ -d .asset-import/visual-novel-ai-game ]; then
            python scripts/import_asset_bundle.py .asset-import/visual-novel-ai-game
          else
            echo "No legacy asset bundle"
          fi

      - name: Remove obsolete transport leftovers
        run: |
          rm -f docs/.asset-pipeline-test*.txt docs/test.bin
          rm -rf blog/assets/visual-novel/hires

      - name: Find changed Telegram publication inputs
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --modified --others --exclude-standard -- \
            'blog/content/*' \
            'blog/assets/**' > "$RUNNER_TEMP/telegram-changed-files"

          echo "Changed article content and assets:"
          cat "$RUNNER_TEMP/telegram-changed-files" || true

      - name: Commit installed publication files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publication files to commit"
          else
            git commit -m "Render and import staged article bundle"
            git push
          fi

      - name: Publish or update installed articles in Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RU_CHAT_ID: ${{ vars.TELEGRAM_RU_CHAT_ID }}
          BLOG_SITE_URL: https://lotargo.github.io
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts/test_publish_telegram.py
          python -m unittest scripts/test_publish_telegram_article.py
          python -m scripts.publish_telegram_article \
            --root . \
            --changed-file-list "$RUNNER_TEMP/telegram-changed-files"

      - name: Commit Telegram publication state
        shell: bash
        run: |
          set -euo pipefail
          state_file="blog/content/telegram-publications.json"

          if [[ ! -f "$state_file" ]] || [[ -z "$(git status --porcelain -- "$state_file")" ]]; then
            echo "No Telegram publication state changes to commit."
            exit 0
          fi

          git add "$state_file"
          git commit -m "Record Telegram article publication"
          git pull --rebase origin main
          git push origin HEAD:main
