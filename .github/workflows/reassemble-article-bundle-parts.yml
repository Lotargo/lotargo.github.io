name: Reassemble split article bundles

on:
  push:
    paths:
      - '.article-import/**/bundle.b64.part-*'
      - '.article-import/**/READY'
      - '.github/workflows/reassemble-article-bundle-parts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: article-bundle-reassembly
  cancel-in-progress: false

jobs:
  reassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble split bundle transports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          rebuilt = 0
          for article_root in sorted(Path('.article-import').glob('*')):
              if not article_root.is_dir():
                  continue
              parts = sorted(article_root.glob('bundle.b64.part-*'))
              if not parts:
                  continue
              if not (article_root / 'READY').is_file():
                  print(f'Skipping incomplete split bundle: {article_root}')
                  continue

              expected = [f'bundle.b64.part-{index:03d}' for index in range(len(parts))]
              actual = [part.name for part in parts]
              if actual != expected:
                  raise SystemExit(
                      f'Non-contiguous split bundle in {article_root}: expected {expected}, got {actual}'
                  )

              target = article_root / 'bundle.b64'
              with target.open('w', encoding='ascii', newline='') as output:
                  for part in parts:
                      output.write(part.read_text(encoding='ascii').strip())
                  output.write('\n')

              for part in parts:
                  part.unlink()
              (article_root / 'READY').unlink(missing_ok=True)
              rebuilt += 1
              print(f'Reassembled {len(parts)} parts: {target}')

          print(f'Reassembled {rebuilt} split article bundle(s)')
          PY

      - name: Commit reassembled bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .article-import
          if git diff --cached --quiet; then
            echo "No split bundles to commit"
          else
            git commit -m "Reassemble staged article bundle"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
